# The synthetic scenario the generator builds.
#
# Everything here is invented. Change a number and run
#   python -m calder_abm.generate_data
# to get a new scenario. The same seed always gives the same data.

seed: 20261015
launch_date: "2024-10-01"   # the AI Assurance and Controls practice starts marketing
end_date: "2026-09-30"      # the last day of data

accounts:
  total: 120
  current_clients: 30       # clients of the firm's other services (audit, tax, advisory)
  former_clients: 10
  tiers: {1: 25, 2: 45, 3: 50}

# Where each account truly stands on the last day of the data. Must add up to accounts.total.
final_positions:
  Signed Agreement: 14
  Lost: 12
  Verbal Commitment: 3
  Proposal / RFP: 5
  Active Conversation: 6
  Qualified Lead: 5
  Stalled: 7
  Interested: 20
  Aware: 28
  Target: 20

# How far each lost deal had got before it was lost (adds up to Lost above).
lost_at:
  Active Conversation: 3
  Proposal / RFP: 6
  Verbal Commitment: 3

signed_by_goal_date: 6      # signed deals that close by the 18-month goal date (2026-03-31)
average_cycle_months: 11
deal_value_usd: {mean: 340000, low: 180000, high: 620000}

# Patterns planted on purpose, so the evaluation can check whether the system
# finds real effects and avoids traps. Written to the answer key; the system never reads them.
planted_patterns:
  real_effects:
    roundtables:              # attending an executive roundtable truly raises the chance of moving into the pipeline
      attending_accounts: 22
      chance_of_moving_forward: 1.0     # every attendee moves forward; for everyone else the chance is roughly a third
    technology_partner_referrals:   # an accepted referral truly raises the chance of moving into the pipeline
      referred_accounts: 16
      never_agreed: 2         # referrals the client never agreed to; nothing follows
      chance_of_moving_forward: 0.9
  traps:
    report_after_progress:    # the report is mostly downloaded after the first meeting, so it cannot have caused it
      share_of_pipeline_accounts_downloading: 0.6
      early_downloads: 8
    current_clients_buy_anyway:     # current clients buy more often AND attend more webinars; webinars do nothing
      buying_weight: 2.5
      chance_of_moving_forward: 0.45
      webinar_attendance_multiplier: 2.5
    linkedin_ads_change_nothing:    # ads reach most accounts and change nothing
      accounts_shown: 100

partner_introductions:
  accounts: 10
  effect_weight: 1.5
  chance_of_moving_forward: 0.55

rfp_led_accounts: 4          # journeys that start with a formal RFP and skip the meetings

