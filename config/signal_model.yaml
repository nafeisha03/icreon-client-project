# The signal model: what each kind of signal means and how strong it is.
#
# Strengths are words, never numbers, and they are never added up into a score.
# They decide which stage a signal can support and they explain decisions.
#
#   direction       Positive, Negative or Neutral
#   strength        None, Very weak, Weak, Medium, Strong, Very strong, Decisive
#   supports_stage  the furthest stage this signal can prove on its own (blank = none)
#   meeting_held    true for meetings that actually took place
#
# "Meaningful activity" means a positive signal of Medium strength or above from
# the account, or any meeting held. Our own actions are never meaningful activity.

signal_types:
